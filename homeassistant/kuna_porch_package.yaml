# Kuna porch camera - local control package for Home Assistant.
# Talks to the on-camera bridge (busybox httpd CGI -> kunadb) at :8089.
#
# SET YOUR CAMERA IP: replace CAMERA_IP below with your camera's LAN IP.
#
# Install: copy to  <config>/packages/kuna_porch_package.yaml
# and ensure configuration.yaml has:
#   homeassistant:
#     packages: !include_dir_named packages
# then Developer Tools -> YAML -> Restart.

# ---- state poller: one REST sensor, attributes feed everything below ----
rest:
  - resource: "http://CAMERA_IP:8089/cgi-bin/kuna?do=state"
    scan_interval: 10
    sensor:
      - name: "Porch Cam State"
        unique_id: porch_cam_state
        value_template: "{{ value_json.bulb }}"
        json_attributes:
          - bulb
          - brightness
          - alarm
          - volume
          - motion_timeout
          - motion_occurred
          - pir_event
          - sensitivity
          - daytime
          - gamma
          - video_flip
          - overlay_ts
          - overlay_motion
          - dusk_offset
          - dawn_offset
          - led_override
          - led_mask
          - reboots
          - rtsp_active

# ---- action endpoints ----
rest_command:
  porch_light_on:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=light&on=1"
  porch_light_off:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=light&on=0"
  porch_light_release:        # hand control back to schedule / motion
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=light&release=1"
  porch_light_brightness:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=bright&v={{ pct }}"
  porch_siren:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=siren&on={{ on }}"
  porch_play:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=play&clip={{ clip }}"
  porch_volume:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=volume&v={{ v }}"
  porch_motion_timeout:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=motiontimeout&v={{ v }}"
  porch_led_mask:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=led&mask={{ m }}"
  porch_led_override:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=led&override={{ v }}"
  porch_overlay_ts:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=overlay&ts={{ v }}"
  porch_overlay_motion:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=overlay&motion={{ v }}"
  porch_flip:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=flip&on={{ v }}"
  porch_gamma:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=gamma&v={{ v }}"
  porch_sensitivity:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=sensitivity&v={{ v }}"
  porch_dusk_offset:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=duskdawn&dusk={{ v }}"
  porch_dawn_offset:
    url: "http://CAMERA_IP:8089/cgi-bin/kuna?do=duskdawn&dawn={{ v }}"

template:
  # ---- the porch light (on/off + brightness) ----
  # (HA 2026 no longer accepts "platform: template" under light:/switch:)
  - light:
      - name: "Porch Light"
        unique_id: porch_light
        state: "{{ state_attr('sensor.porch_cam_state','bulb') }}"
        level: >-
          {{ (state_attr('sensor.porch_cam_state','brightness') | int(0) * 255 / 100) | int }}
        turn_on:
          - service: rest_command.porch_light_on
        turn_off:
          - service: rest_command.porch_light_off
        set_level:
          - service: rest_command.porch_light_brightness
            data:
              pct: "{{ (brightness | int(0) * 100 / 255) | int }}"
          - service: rest_command.porch_light_on

  # ---- siren + status-LED-off as switches ----
  - switch:
      - name: "Porch Siren"
        unique_id: porch_siren
        state: "{{ state_attr('sensor.porch_cam_state','alarm') }}"
        turn_on:
          service: rest_command.porch_siren
          data: { on: 1 }
        turn_off:
          service: rest_command.porch_siren
          data: { on: 0 }
      - name: "Porch Status LED Off"
        unique_id: porch_status_led_off
        state: "{{ state_attr('sensor.porch_cam_state','led_mask') }}"
        turn_on:
          service: rest_command.porch_led_mask
          data: { m: 1 }
        turn_off:
          service: rest_command.porch_led_mask
          data: { m: 0 }
      - name: "Porch Timestamp Overlay"
        unique_id: porch_overlay_ts
        state: "{{ state_attr('sensor.porch_cam_state','overlay_ts') }}"
        turn_on:
          service: rest_command.porch_overlay_ts
          data: { v: 1 }
        turn_off:
          service: rest_command.porch_overlay_ts
          data: { v: 0 }
      - name: "Porch Motion Overlay"
        unique_id: porch_overlay_motion
        state: "{{ state_attr('sensor.porch_cam_state','overlay_motion') }}"
        turn_on:
          service: rest_command.porch_overlay_motion
          data: { v: 1 }
        turn_off:
          service: rest_command.porch_overlay_motion
          data: { v: 0 }
      - name: "Porch Video Flip"
        unique_id: porch_video_flip
        state: "{{ state_attr('sensor.porch_cam_state','video_flip') }}"
        turn_on:
          service: rest_command.porch_flip
          data: { v: 1 }
        turn_off:
          service: rest_command.porch_flip
          data: { v: 0 }

  # ---- numbers, binary sensors, sound buttons ----
  - number:
      - name: "Porch Motion Timeout"
        unique_id: porch_motion_timeout
        unit_of_measurement: "s"
        min: 5
        max: 600
        step: 5
        state: "{{ state_attr('sensor.porch_cam_state','motion_timeout') | int(30) }}"
        set_value:
          service: rest_command.porch_motion_timeout
          data: { v: "{{ value | int }}" }
      - name: "Porch Volume"
        unique_id: porch_volume
        min: 0
        max: 100
        step: 5
        state: "{{ state_attr('sensor.porch_cam_state','volume') | int(100) }}"
        set_value:
          service: rest_command.porch_volume
          data: { v: "{{ value | int }}" }
      - name: "Porch Motion Sensitivity"
        unique_id: porch_sensitivity
        min: 0
        max: 100
        step: 1
        state: "{{ state_attr('sensor.porch_cam_state','sensitivity') | int(12) }}"
        set_value:
          service: rest_command.porch_sensitivity
          data: { v: "{{ value | int }}" }
      - name: "Porch Gamma"          # DB_IMG_GAMMA = gamma*10 (10=1.0 .. 30=3.0)
        unique_id: porch_gamma
        min: 10
        max: 30
        step: 1
        state: "{{ state_attr('sensor.porch_cam_state','gamma') | int(16) }}"
        set_value:
          service: rest_command.porch_gamma
          data: { v: "{{ value | int }}" }
      - name: "Porch Dusk Offset"    # minutes before(-)/after(+) dusk the light turns on
        unique_id: porch_dusk_offset
        unit_of_measurement: "min"
        min: -120
        max: 120
        step: 5
        state: "{{ state_attr('sensor.porch_cam_state','dusk_offset') | int(0) }}"
        set_value:
          service: rest_command.porch_dusk_offset
          data: { v: "{{ value | int }}" }
      - name: "Porch Dawn Offset"    # minutes before(-)/after(+) dawn the light turns off
        unique_id: porch_dawn_offset
        unit_of_measurement: "min"
        min: -120
        max: 120
        step: 5
        state: "{{ state_attr('sensor.porch_cam_state','dawn_offset') | int(0) }}"
        set_value:
          service: rest_command.porch_dawn_offset
          data: { v: "{{ value | int }}" }
  - binary_sensor:
      - name: "Porch Daytime"
        unique_id: porch_daytime
        state: "{{ state_attr('sensor.porch_cam_state','daytime') }}"
      - name: "Porch Motion"
        unique_id: porch_motion
        device_class: motion
        state: "{{ state_attr('sensor.porch_cam_state','motion_occurred') }}"
      - name: "Porch RTSP Viewed"
        unique_id: porch_rtsp_viewed
        state: "{{ state_attr('sensor.porch_cam_state','rtsp_active') }}"
  - sensor:
      # PIR event counter: it increments on each hardware-PIR trip. Trigger automations
      # on a change of this value (distinct from video motion above).
      - name: "Porch PIR Event Counter"
        unique_id: porch_pir_event
        state: "{{ state_attr('sensor.porch_cam_state','pir_event') | int(0) }}"
      - name: "Porch Error Reboots"
        unique_id: porch_error_reboots
        state: "{{ state_attr('sensor.porch_cam_state','reboots').reboots | int(0) }}"
  - button:
      - name: "Porch Chime"
        unique_id: porch_chime
        press:
          service: rest_command.porch_play
          data: { clip: "chime.wav" }
      - name: "Porch Dog Bark"
        unique_id: porch_dog_bark
        press:
          service: rest_command.porch_play
          data: { clip: "dog1.wav" }
      - name: "Porch Light Auto (release)"
        unique_id: porch_light_release
        press:
          service: rest_command.porch_light_release

# ---- two-way audio ----
# The bridge exposes two endpoints (not plain rest_commands because they carry audio):
#   LISTEN:  GET  http://CAMERA_IP:8089/cgi-bin/kuna?do=listen&sec=5   -> returns a WAV
#            (mic capture, max 30s). Fetch/save it, or point a media player at it.
#   TALK:    POST a WAV body to http://CAMERA_IP:8089/cgi-bin/kuna?do=talk&vol=65536
#            -> plays it through the speaker (push-to-talk / announcements).
# Example shell_command (uncomment; needs curl on the HA host):
# shell_command:
#   porch_talk: "curl -s --data-binary @{{ file }} 'http://CAMERA_IP:8089/cgi-bin/kuna?do=talk'"
#   porch_listen: "curl -s 'http://CAMERA_IP:8089/cgi-bin/kuna?do=listen&sec={{ sec }}' -o {{ out }}"
# For announcements, TTS -> wav -> porch_talk; for a doorbell clip use the sound buttons above.
# (Live continuous duplex intercom is a separate effort - see docs/firmware-reference.md.)

# ---- live video (RTSP) + snapshot ----
# Easiest to add the Generic Camera via the UI instead (Settings > Devices > Add
# Integration > Generic Camera), stream source:
#   rtsp://CAMERA_IP:554/stream1   (main)   /stream2 (sub)
# and still image URL (JPEG snapshot, served from the camera's live thumbnail):
#   http://CAMERA_IP:8089/cgi-bin/kuna?do=snapshot
# Or uncomment below (needs the ffmpeg integration):
# camera:
#   - platform: generic
#     name: Porch Cam
#     stream_source: "rtsp://CAMERA_IP:554/stream1"
#     rtsp_transport: tcp
